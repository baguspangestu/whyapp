name: whyapp
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc: ^9.2.1
  dio: ^5.11.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  google_mobile_ads: ^9.1.0
  go_router: ^18.0.0
  in_app_purchase: ^3.3.0
  internet_connection_checker_plus: ^3.1.1
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.5.41
  path: ^1.9.1
  path_provider: ^2.1.6
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.9.2
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  freezed: ^4.0.0-dev.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/chat_wallpaper_light.png
    - assets/images/chat_wallpaper_dark.png
    - assets/images/app_icon_question.png
    - assets/images/splash_icon_light.png
    - assets/images/splash_icon_dark.png
    - assets/images/splash_icon_android12_light.png
    - assets/images/splash_icon_android12_dark.png
    - assets/images/google_play_points.png
    - assets/images/dana.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon_question.png"
  min_sdk_android: 24
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFF7FA"
  color_dark: "#160E12"
  image: assets/images/splash_icon_light.png
  image_dark: assets/images/splash_icon_dark.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#FFF7FA"
    color_dark: "#160E12"
    image: assets/images/splash_icon_android12_light.png
    image_dark: assets/images/splash_icon_android12_dark.png
